<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{siteTitle}}</title>
<meta name="description" content="Early-Access-Test – finde heraus, welche Produkte wirklich gefragt sind.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="logo-dot"><span data-logo-emoji>🚪</span></span>
      <span data-site-title>Meine Produktidee</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Produkte</a>
      <a href="team.html">Team</a>
      <a href="datenschutz.html">Datenschutz</a>
      <a href="impressum.html">Impressum</a>
    </nav>
  </div>
</header>

<!-- WARUM -- Golden Circle: Start With Why -->
<section class="why-section">
  <div class="container">
    <span class="badge" id="whyBadge"></span>
    <h1 id="whyHeadline"></h1>
    <p class="subtext" id="whyText"></p>
  </div>
</section>

<!-- WIE -- Golden Circle: How -->
<section class="how-section">
  <div class="container">
    <h2 id="howTitle"></h2>
    <div id="howGrid" class="how-grid"></div>
  </div>
</section>

<!-- WAS -- Golden Circle: What (die Türen) -->
<section class="what-section">
  <div class="container">
    <h2 id="whatTitle"></h2>
    <p class="lead" id="whatText"></p>
    <div id="doorsGrid" class="doors-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <span>&copy; <span id="year"></span> <span data-site-title>Meine Produktidee</span></span>
    <nav>
      <a href="team.html">Team</a>
      <a href="datenschutz.html">Datenschutz</a>
      <a href="impressum.html">Impressum</a>
      <a href="auswertung.html">Auswertung</a>
    </nav>
  </div>
</footer>

<div class="consent-banner" id="consentBanner">
  <p>Wir verwenden anonyme Analyse-Funktionen (eigenes Tracking, optional Google Analytics), um zu verstehen, welche Produktideen auf Interesse stoßen. Details in der <a href="datenschutz.html">Datenschutzerklärung</a>.</p>
  <div class="actions">
    <button type="button" class="btn btn-primary" id="consentAccept">Akzeptieren</button>
    <button type="button" class="btn btn-ghost" id="consentDecline">Ablehnen</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/tracking.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
